[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bandkit"
version = "0.1.0"
description = "Parse, analyse (effective mass, Rashba/Zeeman splitting, orbital character) and plot VASP band structures"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Sankalpa" }, { name = "Taranga" }, { name = "Ayushi" }]
dependencies = ["numpy>=1.21", "matplotlib>=3.5"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
bandkit = "bandkit.cli:main"

[tool.setuptools.packages.find]
include = ["bandkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
